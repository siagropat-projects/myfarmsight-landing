  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join the MyFarmSight waitlist and be among the first to hear about updates.">
  <link rel="icon" type="image/png" href="/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <title>MyFarmSight Waitlist</title>

  <style>
        :root {
      --green: #2ecc40;
      --green-dark: #1fa32e;
      --ink: #17251a;
      --muted: #59665c;
      --line: #e2eee3;
      --paper: #f7fbf7;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--line);
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Main wrapper for logo and Google Form */
.waitlist-wrapper {
  width: 100%;
  max-width: 645px;
  margin: 20px auto 0;
  padding: 0;
}

/* Logo container */
.logo-container {
  width: 100%;
  height: 150px;
  padding: 25px 20px;
  background-color: #eaf5e9;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 10px 10px 0 0;
}

.logo-container img {
  width: 250px;
  max-width: 70%;
  height: auto;
  object-fit: contain;
}

/* Google Form */
.form-container {
  width: 100%;
}

.form-container iframe {
  display: block;
  width: 100%;
  height: 2800px;
  border: none;
}

/* Mobile responsiveness */
@media (max-width: 600px) {
  .waitlist-wrapper {
    width: 100%;
    margin: 10px auto 0;
  }

  .logo-container {
    height: 120px;
    padding: 20px 15px;
    border-radius: 8px 8px 0 0;
  }

  .logo-container img {
    width: 180px;
    max-width: 65%;
  }

  .form-container iframe {
    height: 3200px;
  }
}
  </style>

        src="/images/my-farm-sight-logo.svg"
        alt="MyFarmSight Logo">
    </div>

    <!-- Google Waitlist Form -->
    <div class="form-container">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSc7Ab8PihlCORSE4cXmGw341b6pS1CXuAoavBwmZu5BvMJReQ/viewform?embedded=true"
