  <meta name="description" content="Join the MyFarmSight waitlist and be among the first to hear about updates.">

  <title>MyFarmSight Waitlist</title>

  <style>
        :root {
      --green: #2ecc40;
      --green-dark: #1fa32e;
      --ink: #17251a;
      --muted: #59665c;
      --line: #e2eee3;
      --paper: #f7fbf7;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--line);
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    body.form-submitted {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }

    /* Main wrapper for logo and Google Form. */
.waitlist-wrapper {
  width: 100%;
  max-width: 645px;
  margin: 20px auto 0;
  padding: 0;
}

/* Logo container */
.logo-container {
  width: 100%;
  height: 150px;
  padding: 25px 20px;
  background-color: #eaf5e9;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 10px 10px 0 0;
}

.logo-container img {
  width: 250px;
  max-width: 70%;
  height: auto;
  object-fit: contain;
}

/* Google Form */
.form-container {
  width: 100%;
}

.form-container iframe {
  display: block;
  width: 100%;
  height: 2829px;
  border: none;
}

body.form-submitted .waitlist-wrapper,
body.form-submitted .form-container {
  height: 100vh;
  height: 100dvh;
}

body.form-submitted .waitlist-wrapper {
  display: flex;
  flex-direction: column;
  margin-top: 0;
}

body.form-submitted .logo-container {
  flex: 0 0 150px;
}

body.form-submitted .form-container {
  flex: 1;
  min-height: 0;
}

body.form-submitted .form-container iframe {
  height: 100%;
}

/* Mobile responsiveness */
@media (max-width: 600px) {
  .waitlist-wrapper {
    width: 100%;
    margin: 10px auto 0;
  }

  .logo-container {
    height: 120px;
    padding: 20px 15px;
    border-radius: 8px 8px 0 0;
  }

  .logo-container img {
    width: 180px;
    max-width: 65%;
  }

  body.form-submitted .logo-container {
    flex-basis: 120px;
  }
}

     <noscript>
    <img height="1" width="1"
      style="display:none"

      alt="">

  <div class="waitlist-wrapper">

    <!-- MyFarmSight Logo -->
    <div class="logo-container">
      <img
        src="/images/my-farm-sight-logo.svg"
        alt="MyFarmSight Logo"> 
    </div>

    <!-- Google Waitlist Form -->
    <div class="form-container">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSc7Ab8PihlCORSE4cXmGw341b6pS1CXuAoavBwmZu5BvMJReQ/viewform?embedded=true"
        title="MyFarmSight waitlist form"
        loading="eager">
        Loading...
      </iframe>
    </div>

  </div>

  <script>
    const waitlistFrame = document.querySelector('.form-container iframe');
    const formHeights = [
      [320, 3479],
      [360, 3369],
      [375, 3283],
      [390, 3199],
      [414, 3135],
      [430, 3093],
      [450, 3051],
      [480, 2983],
      [520, 2963],
      [560, 2875],
      [600, 2829],
      [645, 2829]
    ];
    let waitlistFrameLoaded = false;
    let waitlistFormSubmitted = false;

    function resizeWaitlistFrame() {
      if (waitlistFormSubmitted) return;

      const width = Math.min(Math.max(window.innerWidth, 320), 645);
      let lower = formHeights[0];
      let upper = formHeights[formHeights.length - 1];

      for (let i = 1; i < formHeights.length; i++) {
        if (width <= formHeights[i][0]) {
          lower = formHeights[i - 1];
          upper = formHeights[i];
          break;
        }
      }

      const ratio = (width - lower[0]) / (upper[0] - lower[0]);
      waitlistFrame.style.height = `${Math.round(lower[1] + ratio * (upper[1] - lower[1]))}px`;
    }

    waitlistFrame.addEventListener('load', function() {
      if (!waitlistFrameLoaded) {
        waitlistFrameLoaded = true;
        return;
      }

      waitlistFormSubmitted = true;
      document.body.classList.add('form-submitted');
      waitlistFrame.style.height = '';
      window.scrollTo(0, 0);
    });

    window.addEventListener('resize', resizeWaitlistFrame);
    resizeWaitlistFrame();
  </script>
</body>
